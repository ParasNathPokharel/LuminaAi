# ==============================================================================
# Lumina AI — Nginx Reverse Proxy & SSL Configuration
# Domain: parasnathpokharel.com.np & www.parasnathpokharel.com.np
# SSL certificates managed via Certbot / Let's Encrypt
# ==============================================================================

# Rate limiting zone (10 requests per second per IP; burst of 20 for AI requests)
limit_req_zone $binary_remote_addr zone=ai_req_limit:10m rate=10r/s;

# 1. HTTP → HTTPS Redirect (Port 80 → 443)
server {
    listen 80;
    listen [::]:80;
    server_name parasnathpokharel.com.np www.parasnathpokharel.com.np;

    # Let's Encrypt ACME HTTP challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.parasnathpokharel.com.np$request_uri;
    }
}

# 2. Apex Domain → www Redirect (HTTPS)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name parasnathpokharel.com.np;

    ssl_certificate /etc/letsencrypt/live/parasnathpokharel.com.np/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/parasnathpokharel.com.np/privkey.pem;

    return 301 https://www.parasnathpokharel.com.np$request_uri;
}

# 3. Primary HTTPS Production Server — www.parasnathpokharel.com.np
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.parasnathpokharel.com.np;

    # SSL Certificates (managed via Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/parasnathpokharel.com.np/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/parasnathpokharel.com.np/privkey.pem;

    # Modern SSL — TLS 1.2 & 1.3 only
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Allow up to 25MB image uploads
    client_max_body_size 30M;
    client_body_buffer_size 128k;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static Asset Caching (7-day)
    location ~* \.(css|js|png|jpg|jpeg|svg|webp|ico|woff2)$ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Reverse Proxy → Flask/Gunicorn
    location / {
        limit_req zone=ai_req_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeouts for U2-Net AI inference and SVG vectorization
        proxy_connect_timeout 120s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}
